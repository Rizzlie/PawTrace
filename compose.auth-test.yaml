# Isolated, disposable infrastructure for signed-provider HTTP/browser verification.
services:
  redis:
    image: redis:7.4.6-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: pawtrace_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: pawtrace_test
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pawtrace_test -d pawtrace_test']
      interval: 2s
      timeout: 3s
      retries: 30
