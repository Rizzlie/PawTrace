<div
  #canvas
  class="canvas"
  [attr.aria-busy]="map.loading()"
  role="region"
  aria-label="Mapa poszukiwań"
></div>
<div class="map-tools" role="group" aria-label="Narzędzia mapy">
  <div class="basemaps" role="group" aria-label="Podkład mapy">
    <button
      type="button"
      [attr.aria-pressed]="map.basemap() === 'osm'"
      (click)="map.selectBasemap('osm')"
    >
      Mapa OSM
    </button>
    <button
      type="button"
      [attr.aria-pressed]="map.basemap() === 'satellite'"
      (click)="map.selectBasemap('satellite')"
    >
      Satelita
    </button>
  </div>
  <button type="button" [disabled]="map.locating()" (click)="map.locate()">
    <span aria-hidden="true">⌖</span> Moja lokalizacja
  </button>
</div>
@if (map.tileMessage() || map.locationMessage()) {
<aside class="messages" aria-label="Komunikaty mapy">
  @if (map.tileMessage()) {
  <p role="status">{{ map.tileMessage() }}</p>
  <button type="button" (click)="map.retryTiles()">
    Ponów pobieranie mapy
  </button>
  } @if (map.locationMessage()) {
  <p role="status">{{ map.locationMessage() }}</p>
  }
</aside>
} @if (map.showMapboxLogo()) {
<a class="mapbox-logo" href="https://www.mapbox.com/" aria-label="Mapbox"
  ><img src="assets/mapbox-logo.svg" alt="Mapbox" width="88" height="20"
/></a>
}
