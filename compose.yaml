services:
  pawtrace:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:3000'
    volumes:
      - '${ASSET_DIRECTORY:-./data/assets}:/app/data/assets'
    environment:
      ASSET_DIRECTORY: /app/data/assets
      DATABASE_URL: postgres://pawtrace:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/pawtrace
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to an HTTPS origin}
      AUTH_EMAIL_ALLOWLIST: ${AUTH_EMAIL_ALLOWLIST:-}
      IMAGE_PROCESSING_TIMEOUT_MS: ${IMAGE_PROCESSING_TIMEOUT_MS:-60000}
      REDIS_URL: redis://redis:6379
      MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-}
      OSM_TILE_URL: ${OSM_TILE_URL:-}
      OSM_ATTRIBUTION: ${OSM_ATTRIBUTION:-}
      SATELLITE_TILE_URL: ${SATELLITE_TILE_URL:-}
      SATELLITE_ATTRIBUTION: ${SATELLITE_ATTRIBUTION:-}
      ADDRESS_SEARCH_URL: ${ADDRESS_SEARCH_URL:-https://nominatim.openstreetmap.org/search}
      ADDRESS_SEARCH_USER_AGENT: ${ADDRESS_SEARCH_USER_AGENT:-PawTrace/1.0 (+https://github.com/Rizzlie/PawTrace)}
      ADDRESS_SEARCH_ATTRIBUTION: ${ADDRESS_SEARCH_ATTRIBUTION:-© OpenStreetMap contributors}
      ADDRESS_SEARCH_ATTRIBUTION_URL: ${ADDRESS_SEARCH_ATTRIBUTION_URL:-https://www.openstreetmap.org/copyright}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: pawtrace
      POSTGRES_DB: pawtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pawtrace -d pawtrace']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.6-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
