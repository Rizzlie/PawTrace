# Standalone infrastructure for everyday local use, isolated from disposable tests.
name: pawtrace-local-data

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: pawtrace
      POSTGRES_DB: pawtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node tools/init-local-data.mjs first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pawtrace -d pawtrace']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run node tools/init-local-data.mjs first}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --maxmemory 64mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres-data:
  redis-data:
