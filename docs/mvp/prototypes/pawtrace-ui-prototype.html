<!doctype html>
<!-- THROWAWAY PROTOTYPE. Three layout variants on one HTML route, switchable with ?variant=A|B|C. No persistence or real map service. -->
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PawTrace — prototyp układu</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:0 0 76px;font:14px system-ui,sans-serif;color:var(--foreground,#202b2b)}button,input,select,textarea{font:inherit}button{cursor:pointer}button,input,select,textarea{border:1px solid #cdd6d1;border-radius:8px;padding:9px;background:#fff;color:#243732}button:hover{background:#eaf3ed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #5caa8c;outline-offset:2px}button.primary{background:#225c48;color:white;border-color:#225c48}button.small{padding:6px 9px;font-size:12px}button.on{background:#225c48;color:white}p{line-height:1.5}h2,h3,p{margin:0 0 10px}h2{font-size:18px}h3{font-size:15px}.controls{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}.controls span{font-size:12px;color:var(--muted-foreground,#64716b)}.controls button{font-size:12px}.description{font-size:13px;margin-bottom:12px;color:var(--muted-foreground,#64716b)}.device{width:100%;margin:auto;transition:width .15s}.device.phone{max-width:390px}.app{background:#f7f8f5;color:#243732;border:1px solid #cdd6d1;border-radius:12px;overflow:hidden;position:relative}.header{padding:12px 16px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #dbe0db;flex-wrap:wrap}.brand{font-size:19px;font-weight:750;color:#225c48}.badge{font-size:10px;letter-spacing:.07em;color:#68776e}.header-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.save{font-size:11px;color:#69776d}.body{height:510px;position:relative}.map{height:100%;min-height:210px;position:relative;background:#e5e9dd;overflow:hidden}.map svg{width:100%;height:100%;position:absolute;inset:0}.map-toolbar{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:5px;flex-wrap:wrap;z-index:2}.map-toolbar button{background:#fffffff2;font-size:11px;padding:7px}.map-label{position:absolute;bottom:12px;left:12px;font-size:10px;background:#ffffffe6;padding:5px 8px;border-radius:5px}.pin{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid #487a65;border-radius:50%;width:34px;height:34px;padding:0;font-size:11px;box-shadow:0 2px 5px #0002;z-index:1}.pin.selected{border-color:#f7f7ed;background:#225c48;color:white;outline:3px solid #225c48}.pin-label{position:absolute;left:50%;top:35px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#284235;border-radius:4px;padding:3px 6px;font-size:10px}.list{padding:14px;background:#fff;overflow:auto}.list button.place{display:block;text-align:left;width:100%;margin-bottom:8px;background:#f8faf7;padding:10px}.list button.place.selected{background:#e8f1e9;border-color:#7b9e83}.place strong{font-size:12px;display:block;margin-bottom:4px}.place span{font-size:10px;color:#68776e}.tags{font-size:10px;color:#52715c;margin:5px 0 10px}.detail{background:#fff;padding:16px;overflow:auto}.detail .primary{width:100%;margin:6px 0 13px}.history{margin-top:10px}.event{position:relative;padding:0 0 15px 16px;border-left:2px solid #dce7de;margin-left:4px}.event:before{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#69957b;left:-5px;top:4px}.event time{display:block;font-size:10px;color:#718076;margin-bottom:5px}.event strong{font-size:12px;display:block}.event p{font-size:11px;margin:4px 0}.event .kind{font-size:9px;background:#eaf0e7;padding:2px 5px;border-radius:4px;display:inline-block}.variant-A .body{display:grid;grid-template-columns:160px minmax(120px,1fr) 240px}.variant-A .list{border-right:1px solid #dbe0db}.variant-A .detail{border-left:1px solid #dbe0db}.variant-B .body>.map{height:100%}.variant-B .list{position:absolute;left:12px;top:92px;width:180px;max-height:240px;border-radius:10px;box-shadow:0 3px 18px #30452b24;display:none}.variant-B .list.open{display:block;z-index:4}.variant-B .detail{position:absolute;right:12px;bottom:12px;width:300px;max-height:335px;border-radius:12px;box-shadow:0 3px 18px #30452b24;z-index:3}.variant-B .detail .history{max-height:155px;overflow:auto}.variant-B .map-toolbar{right:12px}.variant-C .body{display:grid;grid-template-columns:minmax(240px,1fr) minmax(160px,1fr)}.variant-C .list{display:none}.variant-C .detail{grid-column:1;grid-row:1;border-right:1px solid #dbe0db}.variant-C .map{grid-column:2;grid-row:1}.variant-C .detail h2:before{content:'Dziennik miejsca / ';font-size:11px;color:#78877b;display:block;margin-bottom:10px}.variant-C .map-toolbar{top:auto;bottom:40px}.mobile-nav{display:none;padding:8px;background:white;border-bottom:1px solid #dbe0db;gap:5px}.state{font-size:11px;line-height:1.5;color:var(--muted-foreground,#68776e);margin-top:10px}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#203c31;color:#fff;border-radius:30px;padding:7px;box-shadow:0 4px 20px #0003;z-index:20;max-width:calc(100% - 12px)}.switcher button{border:0;background:#375b49;color:#fff;border-radius:24px;min-width:35px}.switcher .label{font-size:12px;text-align:center;min-width:190px}.switcher .label small{display:block;opacity:.7;font-size:9px}.modal-backdrop{position:fixed;inset:0;background:#172c2460;z-index:30;display:grid;place-items:center;padding:16px}.modal{background:#fff;color:#243732;padding:20px;border-radius:12px;width:min(100%,460px);max-height:620px;overflow:auto}.modal label{display:block;font-size:12px;margin:12px 0 4px}.modal input,.modal select,.modal textarea{width:100%}.modal footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal p{font-size:12px}.notice{font-size:11px;color:#6f5d2e;background:#f7f2df;padding:8px;border-radius:6px;margin-bottom:10px}.empty{font-size:12px;color:#6b786e}.phone .header-tools .save{display:none}.phone .header{padding:10px}.phone .header-tools button{padding:6px;font-size:11px}.phone .body{height:580px;display:block}.phone .mobile-nav{display:flex}.phone.variant-A .list,.phone.variant-A .detail{display:none}.phone.variant-A .map{height:100%}.phone.variant-A .body[data-panel=list] .list,.phone.variant-A .body[data-panel=detail] .detail{display:block;position:absolute;inset:0;z-index:5}.phone.variant-A .body[data-panel=list] .map,.phone.variant-A .body[data-panel=detail] .map{display:none}.phone.variant-B .detail{left:10px;right:10px;bottom:10px;width:auto;max-height:310px}.phone.variant-B .list{left:10px;top:88px;width:200px}.phone.variant-B .body[data-panel=list] .list{display:block}.phone.variant-C .body{display:flex;flex-direction:column}.phone.variant-C .map{height:210px;min-height:210px;order:0}.phone.variant-C .detail{height:370px;order:1}.phone.variant-C .body[data-panel=list] .list{display:block;position:absolute;inset:0;z-index:5}.phone.variant-C .map-toolbar{top:10px;bottom:auto}.phone.variant-C .map-label{bottom:4px}
@media(max-width:600px){.variant-A:not(.phone) .body{grid-template-columns:1fr;height:680px}.variant-A:not(.phone) .list{display:none}.variant-A:not(.phone) .map{height:270px}.variant-A:not(.phone) .detail{height:410px}.variant-B .detail{width:calc(100% - 24px)}.variant-C:not(.phone) .body{display:flex;flex-direction:column;height:680px}.variant-C:not(.phone) .map{height:230px;order:0}.variant-C:not(.phone) .detail{height:450px;order:1}.header-tools .save{display:none}.header-tools button{font-size:11px;padding:6px}}
</style></head><body>
<div class="controls"><span>PROTOTYP • fikcyjne dane, zmiany tylko w pamięci</span><div><button id="desktop" class="on" onclick="setDevice(false)">Komputer</button> <button id="phone" onclick="setDevice(true)">Telefon</button></div></div>
<p id="description" class="description"></p><div id="device" class="device app"></div><div id="state" class="state"></div>
<nav class="switcher" style="position:sticky;left:auto;transform:none;width:max-content;margin:16px auto 0" aria-label="Wariant układu"><button onclick="cycle(-1)" aria-label="Poprzedni wariant">←</button><div class="label" id="variant-label"></div><button onclick="cycle(1)" aria-label="Następny wariant">→</button></nav>
<div id="modal-root"></div>
<script>
const variants={A:{name:'Mapa i dwa panele',desc:'A — Lista miejsc po lewej, mapa pośrodku, historia po prawej. Na telefonie przełączasz mapę, miejsca i historię.'},B:{name:'Mapa z panelem',desc:'B — Mapa zajmuje cały ekran roboczy. Historia wybranego punktu otwiera się nad mapą, a listę miejsc wywołujesz przyciskiem.'},C:{name:'Dziennik obok mapy',desc:'C — Historia jest głównym widokiem, mapa pomaga zlokalizować miejsce. Na telefonie mała mapa znajduje się nad historią.'}};
const places=[{name:'Garaże przy Lipowej',roles:'Kryjówka · Karmienie',x:52,y:43},{name:'Dom — miejsce ucieczki',roles:'Miejsce ucieczki',x:26,y:69},{name:'Wejście do parku',roles:'Fotopułapka',x:76,y:26}];
const entries=[[{kind:'Sprawdzenie',time:'16 paź · 15:00',text:'Karmy już nie ma',desc:'Nie wiadomo, jakie zwierzę ją zjadło.'},{kind:'Sprawdzenie',time:'16 paź · 08:00',text:'Karma nadal jest',desc:'Miska bez widocznych zmian.'},{kind:'Działanie',time:'15 paź · 22:00',text:'Wyłożono mokrą karmę',desc:'Miska przy wejściu pod garaż.'},{kind:'Obserwacja',time:'15 paź · 15:00',text:'Widziano czarnego kota',desc:'Relacja sąsiada · prawdopodobne'}],[{kind:'Notatka',time:'15 paź · 12:00',text:'Otwarte okno od strony ogrodu',desc:'Przybliżony czas ucieczki: 11:00–12:00.'}],[]];
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants[variant])variant='A';let selected=0,phone=window.innerWidth<600,panel='map',showList=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mapMarkup(){return `<section class="map" aria-label="Schemat mapy — fikcyjne dane"><svg viewBox="0 0 600 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="600" height="500" fill="#e7ebdf"/><path d="M400 0H600V300L480 255 390 180Z" fill="#cdddbd"/><path d="M0 380Q150 310 230 410T600 430V500H0Z" fill="#c5d9b9"/><g fill="#d4d4c8" stroke="#c1c4b8"><rect x="100" y="115" width="80" height="40"/><rect x="112" y="195" width="55" height="54"/><rect x="245" y="160" width="92" height="33"/><rect x="245" y="213" width="92" height="33"/><rect x="360" y="310" width="60" height="60"/></g><g fill="none" stroke="#fffef7" stroke-width="23"><path d="M-20 285L650 285"/><path d="M205 -20V520"/><path d="M370 -20L450 520"/></g><g fill="none" stroke="#d0d2c7" stroke-width="1"><path d="M-20 285L650 285"/><path d="M205 -20V520"/></g><path d="M220 145H350V270H220Z" fill="#e9be6640" stroke="#b9903a" stroke-width="2" stroke-dasharray="7 5"/><g fill="#73816a" font-size="12" font-family="system-ui"><text x="240" y="280">ul. Lipowa</text><text x="455" y="130">Park</text><text x="225" y="138">Obszar A</text></g></svg><div class="map-toolbar"><button onclick="openSearch()">⌕ Adres</button><button onclick="openFilter()">Filtry</button><button onclick="showList=!showList;panel='list';render()">Miejsca</button><button onclick="openPoint()">+ Punkt</button><button onclick="openArea()">Obszar</button></div>${places.map((p,i)=>`<button class="pin ${selected===i?'selected':''}" style="left:${p.x}%;top:${p.y}%" onclick="selectPlace(${i})" aria-label="${esc(p.name)}">${i+1}<span class="pin-label">${esc(p.name)}</span></button>`).join('')}<span class="map-label">Schemat terenu · podkład przykładowy</span></section>`}
function listMarkup(){return `<aside class="list ${showList?'open':''}"><h3>Miejsca <small>(${places.length})</small></h3>${places.map((p,i)=>`<button class="place ${selected===i?'selected':''}" onclick="selectPlace(${i})"><strong>${esc(p.name)}</strong><span>${esc(p.roles)}<br>${entries[i].length} wpisów historii</span></button>`).join('')}<button class="small" onclick="openPoint()">+ Nowy punkt</button></aside>`}
function detailMarkup(){const p=places[selected];return `<section class="detail"><h2>${esc(p.name)}</h2><div class="tags">${esc(p.roles)}</div><button class="primary" onclick="openEntry()">+ Dodaj wpis historii</button><h3>Historia miejsca</h3><div class="history">${entries[selected].map(e=>`<article class="event"><time>${esc(e.time)}</time><strong>${esc(e.text)}</strong><p>${esc(e.desc)}</p><span class="kind">${esc(e.kind)}</span></article>`).join('')||'<p class="empty">Brak wpisów. Możesz zacząć od obserwacji, działania, sprawdzenia lub notatki.</p>'}</div></section>`}
function VariantA(){return listMarkup()+mapMarkup()+detailMarkup()}function VariantB(){return mapMarkup()+listMarkup()+detailMarkup()}function VariantC(){return detailMarkup()+mapMarkup()+listMarkup()}
function render(){const d=document.getElementById('device');d.className=`device app variant-${variant} ${phone?'phone':''}`;d.innerHTML=`<header class="header"><div><span class="brand">PawTrace</span> <span class="badge">LUNA · SPRAWA</span></div><div class="header-tools"><span class="save">Dane przykładowe</span><button class="small" onclick="openProfile()">Profil</button><button class="small" onclick="openFiles()">Plik JSON</button></div></header><nav class="mobile-nav"><button class="small" onclick="panel='map';showList=false;render()">Mapa</button><button class="small" onclick="panel='list';showList=true;render()">Miejsca</button><button class="small" onclick="panel='detail';render()">Historia</button></nav><div class="body" data-panel="${panel}">${({A:VariantA,B:VariantB,C:VariantC})[variant]()}</div>`;document.getElementById('description').textContent=variants[variant].desc;document.getElementById('variant-label').innerHTML=variant+' · '+variants[variant].name+'<small>← → zmienia układ · szkic do omówienia</small>';document.getElementById('state').textContent=`Stan szkicu: wariant ${variant} · ${phone?'telefon':'komputer'} · wybrany punkt: ${places[selected].name} · ${entries[selected].length} wpisów · widok: ${panel}. Możesz wybrać punkt i dodać przykładowy wpis.`;console.log('prototype-state',{variant,phone,selectedPoint:places[selected].name,entries:entries[selected],panel})}
function cycle(dir){const keys=Object.keys(variants);variant=keys[(keys.indexOf(variant)+dir+3)%3];const u=new URL(location.href);u.searchParams.set('variant',variant);try{history.replaceState({},'',u)}catch{}render()}
function setDevice(v){phone=v;panel='map';document.getElementById('phone').classList.toggle('on',v);document.getElementById('desktop').classList.toggle('on',!v);render()}
function selectPlace(i){selected=i;panel='detail';showList=false;render()}
function modal(title,content,action,label='Zapisz'){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${content}<footer><button onclick="closeModal()">${action?'Anuluj':'Zamknij'}</button>${action?`<button class="primary" id="modal-save">${label}</button>`:''}</footer></section></div>`;if(action)document.getElementById('modal-save').onclick=action;document.querySelector('.modal input,.modal select,.modal button')?.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function openEntry(){modal('Nowy wpis · '+places[selected].name,`<label>Rodzaj</label><select id="entry-kind"><option>Obserwacja</option><option>Działanie</option><option>Sprawdzenie</option><option>Notatka</option></select><label>Czas zdarzenia</label><input id="entry-time" value="16 paź · 18:00"><label>Opis</label><textarea id="entry-text" rows="3" placeholder="Co się wydarzyło?"></textarea><label>Zdjęcia</label><input type="file" accept="image/*" multiple><p class="empty">W tym szkicu pliki nie są wysyłane. Docelowy formularz zmienia pola zależnie od rodzaju wpisu.</p>`,()=>{entries[selected].unshift({kind:document.getElementById('entry-kind').value,time:document.getElementById('entry-time').value||'Czas nieznany',text:document.getElementById('entry-text').value||'Przykładowy wpis',desc:'Dodano w szkicu · wyłącznie w pamięci'});closeModal();render()})}
function openPoint(){modal('Nowy punkt',`<div class="notice">Szkic: pozycja nowego punktu jest przykładowa.</div><label>Nazwa miejsca</label><input id="point-name" placeholder="Np. Podwórko za sklepem"><label>Role</label><input id="point-role" placeholder="Np. Kryjówka · Karmienie">`,()=>{places.push({name:document.getElementById('point-name').value||'Nowe miejsce',roles:document.getElementById('point-role').value||'Bez oznaczeń',x:40,y:56});entries.push([]);selected=places.length-1;panel='detail';closeModal();render()})}
function openProfile(){modal('Profil zwierzaka',`<p>Proponowany formularz w osobnym panelu, otwieranym nad bieżącym widokiem mapy.</p><label>Imię</label><input value="Luna"><label>Gatunek</label><input value="Kot"><label>Wygląd i cechy charakterystyczne</label><textarea rows="2">Cała czarna, mała biała plamka pod szyją.</textarea><label>Zachowanie i zwyczaje</label><textarea rows="2">Nie wychodzi. Płoszy się przy obcych osobach.</textarea><p class="empty">Pozostałe grupy: zdrowie, rozpoznanie, okoliczności ucieczki i zdjęcia. Wszystkie pola opcjonalne. Edycja profilu w tym szkicu nie jest zapisywana.</p>`)}
function openFilter(){modal('Filtry — propozycja do omówienia',`<label>Rola punktu</label><select><option>Wszystkie</option><option>Kryjówka</option><option>Karmienie</option></select><label>Rodzaj wpisu</label><select><option>Wszystkie</option><option>Obserwacja</option><option>Działanie</option><option>Sprawdzenie</option></select><label>Czas zdarzenia</label><input placeholder="Od – do"><p><input type="checkbox" style="width:auto"> Pokaż odrzucone obserwacje</p><p class="empty">Szkic rozmieszczenia kontrolek. Filtrowanie danych omówimy przed implementacją.</p>`)}
function openSearch(){modal('Znajdź miejsce',`<label>Adres lub miejscowość</label><input placeholder="Wpisz adres"><p class="empty">Wynik docelowo przesuwa mapę, nie tworzy punktu. Ten szkic nie łączy się z usługą wyszukiwania.</p>`)}
function openFiles(){modal('Plik sprawy',`<p><strong>Eksportuj JSON</strong> — pobranie całej sprawy; zdjęcia wskazane nazwami plików.</p><p><strong>Otwórz JSON / Nowa sprawa</strong> — ostrzeżenie przed zastąpieniem danych i możliwość wcześniejszego eksportu.</p><p class="empty">Docelowe akcje. Szkic nie zapisuje ani nie importuje plików sprawy.</p>`)}
function openArea(){modal('Obszary i edycja',`<p><strong>1.</strong> Wybierz koło lub wielokąt.</p><p><strong>2.</strong> Zaznacz teren na mapie i nadaj mu nazwę.</p><p><strong>3.</strong> Zatwierdź, cofnij krok lub anuluj.</p><p>Po wybraniu obszaru panel pokazuje jego plan i historię sprawdzeń, z opcją „Dodaj sprawdzenie”.</p><p class="empty">W tym szkicu obszar na mapie jest ilustracją, bez edycji geometrii.</p>`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(document.querySelector('.modal-backdrop'))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1)});setDevice(phone);console.log('prototype-checks',{variants:Object.keys(variants).length,places:places.length,historyAtFirstPoint:entries[0].length,missingDom:!document.getElementById('device')});
</script></body></html>
