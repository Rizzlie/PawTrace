<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PawTrace — mapa z pływającymi panelami</title><style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui,sans-serif;color:var(--foreground,#243b32);padding-bottom:12px}button,input,textarea,select{font:inherit}button{cursor:pointer}button{border:1px solid #dde5dc;background:white;color:#365344;border-radius:10px;padding:9px 12px;transition:background .15s,box-shadow .15s}button:hover{background:#edf5ec}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #75ac8d;outline-offset:2px}button.primary{background:#2c654c;border-color:#2c654c;color:#fff;box-shadow:0 3px 9px #235b4825}.primary:hover{background:#204c39}.small{font-size:11px;padding:6px 9px}.muted{color:#7a897e;font-size:11px}.demo-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:11px;color:var(--muted-foreground,#879589)}.demo-tools button{font-size:11px;padding:6px 10px}.demo-tools button.active{background:#2c654c;color:white}.shell{width:100%;margin:auto;background:#eef2e7;color:#294535;border-radius:18px;overflow:hidden;border:1px solid #dde5dc}.shell.phone{max-width:390px}.header{background:#fcfdf9;padding:14px 18px;display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:1px solid #dae3d7}.logo{display:flex;gap:9px;align-items:center;font-weight:780;font-size:21px;letter-spacing:-.7px;color:#285a41}.logo svg{width:30px;height:30px}.case{font-size:11px;color:#81907d;letter-spacing:0;font-weight:400;margin-top:2px}.header-actions{display:flex;gap:6px;align-items:center}.header-actions .muted{margin-right:5px}.map{height:610px;position:relative;overflow:hidden;background:#e9eedd;isolation:isolate}.map.editing{cursor:crosshair}.terrain{position:absolute;inset:0;width:100%;height:100%;user-select:none}.terrain text{font:12px system-ui;fill:#84907b;letter-spacing:.3px}.map-tools{position:absolute;left:16px;top:16px;display:flex;gap:8px;z-index:5;right:16px;align-items:start}.searchbox{background:#fffffff5;border:1px solid #e1e8dc;border-radius:13px;box-shadow:0 4px 18px #26422a0e;position:relative;width:265px;display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px}.searchbox input{border:0;outline:0;background:transparent;width:100%;padding:7px 0;font-size:12px;color:#365344}.searchbox button{padding:5px 8px;border:0;background:#edf3e9;font-size:12px}.map-tools>.primary{margin-left:auto}.results{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid #dce5d7;border-radius:12px;box-shadow:0 6px 24px #29453520;padding:8px}.results:empty{display:none}.results button{display:block;width:100%;text-align:left;border:0;font-size:12px}.results small{display:block;padding:4px;color:#84917d;font-size:10px}.float{position:absolute;background:#fffffff2;border:1px solid #ffffff;border-radius:16px;box-shadow:0 8px 32px #2f4c2a17,0 1px 4px #2f4c2a0a;backdrop-filter:blur(8px);z-index:3;padding:16px}.places{left:16px;top:79px;width:184px;max-height:310px;overflow:auto}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.panelhead strong{font-size:13px}.iconbutton{border:0;background:#eef4e9;padding:3px 7px;font-size:13px;border-radius:7px}.count{background:#e9f0e3;color:#5e7954;border-radius:6px;padding:2px 6px;font-size:10px}.place{padding:10px;border-radius:10px;width:100%;display:flex;gap:8px;text-align:left;border:0;margin:3px 0}.place.active{background:#e9f2e3}.place .number{background:#e3eddb;color:#47704b;width:24px;height:24px;display:grid;place-items:center;border-radius:8px;flex-shrink:0;font-size:10px}.place.active .number{background:#38664b;color:white}.place strong{font-size:11px;display:block}.place small{display:block;font-size:9px;color:#85907e;margin-top:4px}.place-bottom{border-top:1px solid #edf0e8;margin-top:8px;padding-top:11px}.history-panel{right:16px;bottom:20px;width:260px;max-height:392px;overflow:auto}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#8c997f;margin-bottom:8px}.history-panel h2{font-size:17px;margin:0;font-weight:720;letter-spacing:-.3px}.tags{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}.tag{font-size:9px;background:#eff4e7;color:#6f825f;padding:4px 6px;border-radius:5px}.detail-actions{display:flex;gap:6px;margin:10px 0 16px}.detail-actions .primary{flex:1;font-size:11px}.history-heading{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:11px}.history-heading span{font-size:9px;color:#8b9783}.event{border-left:1px solid #dbe6d4;padding:0 0 14px 14px;margin-left:4px;position:relative}.event:before{content:'';position:absolute;left:-4px;top:4px;width:7px;height:7px;border-radius:50%;background:#7e9b67;box-shadow:0 0 0 3px #fff}.event time{font-size:9px;color:#8d9984;display:block;margin-bottom:5px}.event strong{font-size:11px;display:block;color:#3a5039}.event p{font-size:10px;color:#85917c;line-height:1.5;margin:4px 0}.event .type{font-size:8px;color:#5c7b56;background:#eff4e8;padding:2px 5px;border-radius:4px}.chip{position:absolute;z-index:4;box-shadow:0 4px 18px #29453516;border-radius:12px;background:#fffffff2}.places-chip{top:80px;left:16px}.history-chip{right:16px;bottom:20px;max-width:calc(100% - 32px)}.pin{position:absolute;transform:translate(-50%,-50%);width:31px;height:31px;border-radius:12px 12px 12px 2px;border:3px solid #fff;background:#709366;color:#fff;box-shadow:0 3px 8px #3e643b35;display:grid;place-items:center;padding:0;font-size:11px;z-index:2}.pin.selected{background:#2c654c;box-shadow:0 0 0 6px #2c654c1c,0 3px 8px #3e643b35}.pin .pin-label{position:absolute;left:50%;top:36px;transform:translateX(-50%);white-space:nowrap;font-size:10px;background:#ffffffed;border:1px solid #e5ebdf;border-radius:6px;color:#4c6544;padding:4px 7px;pointer-events:none}.pin.draft{background:#d49643;border-radius:50%;width:38px;height:38px;touch-action:none;cursor:grab;z-index:6;box-shadow:0 0 0 9px #d4964329,0 4px 8px #354e3320}.draft:active{cursor:grabbing}.map-footer{position:absolute;bottom:16px;left:16px;color:#74816c;font-size:9px;z-index:1;line-height:1.7;background:#f8fbf0ba;padding:6px 9px;border-radius:8px}.map-footer b{display:inline-block;width:60px;border-bottom:2px solid #6c7c5f;padding-bottom:2px;color:#5c6e4e;font-size:9px}.map-utility{position:absolute;right:16px;top:80px;display:flex;flex-direction:column;gap:5px;z-index:3}.map-utility button{width:34px;height:34px;padding:0;font-size:15px;box-shadow:0 3px 14px #2945350c}.point-editor{left:16px;bottom:20px;width:300px;padding:17px;z-index:7;max-height:432px;overflow:auto}.point-editor h2{font-size:17px;margin:0 0 8px}.point-editor p{font-size:11px;color:#839078;line-height:1.5}.point-editor label{display:block;font-size:10px;margin:9px 0 5px;color:#718064}.point-editor input{width:100%;padding:9px 10px;border:1px solid #dce5d6;border-radius:9px;background:#fbfcf8;font-size:12px;color:#365344}.point-editor .coords{font-size:10px;background:#f1f5e9;padding:8px;border-radius:7px;color:#7c866b;margin:10px 0}.point-editor footer{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}.point-editor footer button{font-size:11px}.point-editor .notice{font-size:10px;color:#9b7441}.tip{position:absolute;left:50%;top:79px;transform:translateX(-50%);background:#355d46ed;color:#fff;border-radius:30px;padding:9px 14px;font-size:11px;white-space:nowrap;z-index:3}.state{font-size:10px;color:var(--muted-foreground,#84917c);margin-top:10px;line-height:1.6}.modal-backdrop{position:fixed;inset:0;background:#233d2c60;z-index:20;padding:16px;display:grid;place-items:center}.modal{background:#fcfdf9;color:#365344;width:min(100%,440px);padding:24px;border-radius:18px;max-height:640px;overflow:auto;box-shadow:0 15px 70px #12362230}.modal h2{margin:0 0 14px;font-size:20px}.modal p{font-size:12px;line-height:1.6;color:#7b8873}.modal label{display:block;font-size:11px;margin:10px 0 5px}.modal input,.modal textarea,.modal select{width:100%;padding:10px;border:1px solid #dce5d6;border-radius:9px;background:white;color:#365344}.modal footer{display:flex;gap:6px;justify-content:flex-end;margin-top:16px}.empty{font-size:11px;color:#8b9681;line-height:1.6}
.phone .map{height:640px}.phone .header{padding:12px}.phone .header-actions .muted{display:none}.phone .header-actions button{font-size:10px;padding:7px}.phone .logo{font-size:18px}.phone .logo svg{width:25px}.phone .case{font-size:9px}.phone .map-tools{left:12px;right:12px;top:12px;gap:5px}.phone .searchbox{width:auto;flex:1;min-width:0}.phone .map-tools>.primary{font-size:11px;padding:10px}.phone .map-tools>.filters{display:none}.phone .places{left:12px;top:65px;width:185px;z-index:5}.phone .places-chip{top:65px;left:12px}.phone .history-panel{left:12px;right:12px;bottom:14px;width:auto;max-height:255px}.phone .history-chip{right:12px;bottom:14px}.phone .map-utility{right:12px;top:65px}.phone .point-editor{left:12px;right:12px;width:auto;bottom:14px;max-height:350px}.phone .tip{top:110px;max-width:calc(100% - 24px);white-space:normal;text-align:center;font-size:10px}.phone .map-footer{bottom:282px;left:12px;font-size:8px}.phone .history-panel h2{font-size:16px}.phone .detail-actions{margin-bottom:8px}.phone .eyebrow{display:none}.phone .history-heading{margin:7px 0}.phone .tags{margin:7px 0}.phone .event{padding-bottom:10px}.phone .pin-label{font-size:9px}
@media(max-width:430px){.demo-tools{gap:6px;align-items:start}.demo-tools>span{max-width:155px}.demo-tools button{padding:5px 7px;font-size:10px}}
</style></head><body>
<div class="demo-tools"><span>PROTOTYP · dane i mapa przykładowe</span><div><button id="desktop" onclick="setDevice(false)">Komputer</button> <button id="phone" onclick="setDevice(true)">Telefon</button></div></div><div id="app"></div><div id="state" class="state"></div><div id="modal-root"></div>
<script>
const places=[{name:'Garaże przy Lipowej',roles:'Kryjówka · Karmienie',x:48,y:42},{name:'Dom przy ogrodzie',roles:'Miejsce ucieczki',x:31,y:65},{name:'Wejście do parku',roles:'Fotopułapka',x:73,y:25}];
const entries=[[{kind:'Sprawdzenie',time:'16 października · 15:00',text:'Karmy już nie ma',desc:'Brak nagrania. Nie wiadomo, co ją zjadło.'},{kind:'Sprawdzenie',time:'16 października · 08:00',text:'Karma nadal jest',desc:'Miska bez widocznych zmian.'},{kind:'Działanie',time:'15 października · 22:00',text:'Wyłożono mokrą karmę',desc:'Przy wejściu pod garaż.'},{kind:'Obserwacja',time:'15 października · 15:00',text:'Widziano czarnego kota',desc:'Relacja sąsiada · prawdopodobne'}],[{kind:'Notatka',time:'15 października · 12:00',text:'Otwarte okno od strony ogrodu',desc:'Czas ucieczki: około 11:00–12:00.'}],[]];
let phone=innerWidth<600,selected=0,listOpen=!phone,historyOpen=true,draft=null,editingIndex=null,searchQuery='',searchTarget=null;
const addresses=[{name:'Lipowa 12 — garaże',x:48,y:42},{name:'Parkowa 4 — wejście do parku',x:73,y:25},{name:'Ogrodowa 8 — dom',x:31,y:65}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function paw(){return '<svg viewBox="0 0 40 40" fill="currentColor" aria-hidden="true"><ellipse cx="20" cy="27" rx="11" ry="8"/><ellipse cx="8" cy="17" rx="4" ry="5" transform="rotate(-25 8 17)"/><ellipse cx="16" cy="10" rx="4" ry="5"/><ellipse cx="26" cy="11" rx="4" ry="5"/><ellipse cx="33" cy="19" rx="4" ry="5" transform="rotate(25 33 19)"/></svg>'}
function terrain(){return `<svg class="terrain" viewBox="0 0 900 680" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1" fill="#dde6cf"/></pattern></defs><rect width="900" height="680" fill="#eaf0df"/><rect width="900" height="680" fill="url(#grass)"/><path d="M615 0H900V330Q820 365 745 277L610 177Z" fill="#d3e2bf"/><path d="M0 515Q180 430 350 560T900 588V680H0Z" fill="#d8e6c7"/><path d="M785 -20Q690 120 797 245T800 500" fill="none" stroke="#bfdad2" stroke-width="28"/><g fill="#d7ddc9" stroke="#c9d2bc" stroke-width="1"><rect x="190" y="125" width="80" height="55" rx="5"/><rect x="200" y="225" width="66" height="63" rx="5"/><rect x="380" y="210" width="94" height="30" rx="4"/><rect x="380" y="260" width="94" height="30" rx="4"/><rect x="380" y="310" width="94" height="30" rx="4"/><rect x="560" y="420" width="85" height="60" rx="5"/><rect x="145" y="420" width="80" height="65" rx="5"/><rect x="370" y="435" width="58" height="70" rx="5"/></g><g fill="none" stroke="#dce2d3" stroke-width="33"><path d="M-20 369H950"/><path d="M315 -20V700"/><path d="M520 -30L615 700"/></g><g fill="none" stroke="#fffef7" stroke-width="27"><path d="M-20 369H950"/><path d="M315 -20V700"/><path d="M520 -30L615 700"/></g><g fill="#c1d6a8" stroke="#b9ce9f" stroke-width="1">${[[660,80],[705,125],[675,180],[760,60],[820,140],[850,230],[86,565],[145,590],[212,540],[275,610],[430,610],[580,580],[635,615]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="15"/>`).join('')}</g><path d="M360 193H490V350H360Z" fill="#d7b67622" stroke="#b49b64" stroke-width="2" stroke-dasharray="7 5"/><text x="390" y="182" fill="#ac945c">Obszar poszukiwań</text><text x="360" y="374">ul. Lipowa</text><text x="647" y="219">Park nad strumieniem</text><text x="120" y="530">Ogrody</text></svg>`}
function pins(){return places.map((p,i)=>`<button class="pin ${i===selected?'selected':''}" style="left:${p.x}%;top:${p.y}%" onclick="selectPlace(${i});event.stopPropagation()" aria-label="${esc(p.name)}">${i+1}${i===selected?`<span class="pin-label">${esc(p.name)}</span>`:''}</button>`).join('')+(draft?`<button id="draft-pin" class="pin draft" style="left:${draft.x}%;top:${draft.y}%" onpointerdown="startDrag(event)" onclick="event.stopPropagation()" aria-label="Przeciągnij nowy punkt">＋<span class="pin-label">Przeciągnij mnie</span></button>`:'')+(searchTarget&&!draft?`<span class="pin draft" style="left:${searchTarget.x}%;top:${searchTarget.y}%;pointer-events:none">⌕</span>`:'')}
function placePanel(){return listOpen?`<aside class="float places"><div class="panelhead"><strong>Miejsca <span class="count">${places.length}</span></strong><button class="iconbutton" onclick="listOpen=false;render()" aria-label="Zwiń miejsca">−</button></div>${places.map((p,i)=>`<button class="place ${selected===i?'active':''}" onclick="selectPlace(${i})"><span class="number">${i+1}</span><span><strong>${esc(p.name)}</strong><small>${esc(p.roles)}</small></span></button>`).join('')}<div class="place-bottom"><button class="small" onclick="openInfo('Obszary','Tu znajdziesz listę planowanych obszarów i historię ich sprawdzeń.')">▧ Obszary poszukiwań</button></div></aside>`:`<button class="chip places-chip" onclick="listOpen=true;render()">☷ Miejsca <span class="count">${places.length}</span></button>`}
function historyPanel(){const p=places[selected];return historyOpen?`<aside class="float history-panel"><div class="panelhead"><div class="eyebrow">Wybrane miejsce</div><button class="iconbutton" onclick="historyOpen=false;render()" aria-label="Zwiń historię">−</button></div><h2>${esc(p.name)}</h2><div class="tags">${p.roles.split(' · ').map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="detail-actions"><button class="primary" onclick="openEntry()">＋ Dodaj wpis</button><button class="small" onclick="startPoint(${selected})" title="Zmień położenie punktu">⌖ Pozycja</button></div><div class="history-heading"><strong>Historia miejsca</strong><span>Najnowsze u góry</span></div>${entries[selected].map(e=>`<article class="event"><time>${esc(e.time)}</time><strong>${esc(e.text)}</strong><p>${esc(e.desc)}</p><span class="type">${esc(e.kind)}</span></article>`).join('')||'<p class="empty">Jeszcze bez wpisów. Dodaj obserwację, działanie, sprawdzenie lub notatkę.</p>'}</aside>`:`<button class="chip history-chip" onclick="historyOpen=true;render()">◷ ${esc(p.name)} · Historia ↑</button>`}
function pointEditor(){return `<div class="tip">Kliknij mapę lub przeciągnij znacznik</div><section class="float point-editor"><div class="eyebrow">${editingIndex===null?'Nowe miejsce':'Edycja miejsca'}</div><h2>${editingIndex===null?'Gdzie jest ten punkt?':'Zmień położenie punktu'}</h2><p>Wskaż miejsce na mapie albo wyszukaj adres u góry. Znacznik możesz przesunąć.</p><label for="point-name">Nazwa miejsca</label><input id="point-name" value="${esc(draft.name)}" oninput="draft.name=this.value" placeholder="Np. Garaże przy Lipowej"><label for="point-roles">Role punktu</label><input id="point-roles" value="${esc(draft.roles)}" oninput="draft.roles=this.value" placeholder="Np. Kryjówka · Karmienie"><div class="coords" id="draft-position">${positionText()}</div><div class="notice">Schemat mapy. W aplikacji zapiszemy współrzędne geograficzne.</div><footer><button onclick="cancelPoint()">Anuluj</button><button class="primary" onclick="savePoint()">Zapisz punkt</button></footer></section>`}
function positionText(){return `Pozycja na schemacie: ${draft.x.toFixed(1)}% / ${draft.y.toFixed(1)}%`}
function render(){document.getElementById('app').innerHTML=`<div class="shell ${phone?'phone':''}"><header class="header"><div class="logo">${paw()}<div>PawTrace<div class="case">Luna · sprawa zaginięcia</div></div></div><div class="header-actions"><span class="muted">Dane przykładowe</span><button class="small" onclick="openProfile()">Profil</button><button class="small" onclick="openFiles()">Plik JSON</button></div></header><main class="map ${draft?'editing':''}" id="map" onclick="mapClick(event)">${terrain()}<div class="map-tools"><div class="searchbox"><span>⌕</span><input id="address" aria-label="Wyszukaj adres" placeholder="${draft?'Wyszukaj adres punktu…':'Szukaj adresu lub miejsca…'}" value="${esc(searchQuery)}" oninput="searchQuery=this.value;search()" onkeydown="if(event.key==='Enter')search()"><button onclick="search()" aria-label="Wyszukaj">↵</button><div class="results" id="results"></div></div><button class="filters" onclick="openFilter()">☷ Filtry</button><button class="primary" onclick="startPoint()">＋ Punkt</button></div>${pins()}${draft?pointEditor():placePanel()+historyPanel()}<div class="map-utility"><button onclick="openInfo('Moja lokalizacja','W aplikacji ten przycisk przesunie mapę do lokalizacji urządzenia. W szkicu nie pobieramy GPS.')" aria-label="Moja lokalizacja">⌖</button><button onclick="openInfo('Podkład mapy','W aplikacji: mapa uliczna lub zdjęcia satelitarne/lotnicze. Ten prototyp używa schematu terenu.')" aria-label="Zmień podkład">▧</button><button onclick="openInfo('Pomiar','W aplikacji zmierzysz odległość, powierzchnię i promień koła.')" aria-label="Pomiary">↔</button></div><div class="map-footer"><b>100 m*</b><br>*Skala poglądowa · mapa przykładowa</div></main></div>`;document.getElementById('desktop').classList.toggle('active',!phone);document.getElementById('phone').classList.toggle('active',phone);reportState()}
function reportState(){const state={device:phone?'telefon':'komputer',selected:places[selected].name,pointCount:places.length,editing:editingIndex,draft:draft?{...draft}:null,listOpen,historyOpen};document.getElementById('state').textContent=`Szkic · ${phone?'telefon':'komputer'} · ${places.length} miejsc · ${draft?'ustawianie punktu: '+draft.name:'wybrano: '+places[selected].name} · zmiany tylko w pamięci. Wyszukiwanie ma trzy przykładowe adresy: Lipowa, Parkowa, Ogrodowa.`;console.log('state '+JSON.stringify(state))}
function setDevice(v){phone=v;if(v)listOpen=false;render()}
function selectPlace(i){if(draft)return;selected=i;historyOpen=true;if(phone)listOpen=false;render()}
function startPoint(index=null){if(draft){document.getElementById('point-name')?.focus();return}editingIndex=index;draft=index===null?{x:53,y:40,name:'',roles:''}:{...places[index]};searchTarget=null;searchQuery='';render()}
function cancelPoint(){draft=null;editingIndex=null;searchQuery='';render()}
function savePoint(){if(!draft.name.trim()){document.getElementById('point-name').focus();document.getElementById('point-name').placeholder='Nadaj nazwę temu miejscu';return}const p={...draft,name:draft.name.trim(),roles:draft.roles.trim()||'Bez oznaczeń'};if(editingIndex===null){places.push(p);entries.push([]);selected=places.length-1}else{places[editingIndex]=p;selected=editingIndex}draft=null;editingIndex=null;historyOpen=true;searchQuery='';render()}
function locationFromPointer(e){const r=document.getElementById('map').getBoundingClientRect();return {x:Math.max(2,Math.min(98,(e.clientX-r.left)/r.width*100)),y:Math.max(3,Math.min(97,(e.clientY-r.top)/r.height*100))}}
function updateDraft(pos){Object.assign(draft,pos);const pin=document.getElementById('draft-pin');pin.style.left=draft.x+'%';pin.style.top=draft.y+'%';document.getElementById('draft-position').textContent=positionText()}
function mapClick(e){if(!draft||e.target.closest('button,input,.float,.map-tools,.tip,.map-footer'))return;updateDraft(locationFromPointer(e));reportState()}
function startDrag(e){if(!draft)return;e.preventDefault();e.stopPropagation();const pin=e.currentTarget;pin.setPointerCapture(e.pointerId);const move=ev=>updateDraft(locationFromPointer(ev));const end=()=>{pin.removeEventListener('pointermove',move);pin.removeEventListener('pointerup',end);pin.removeEventListener('pointercancel',end);reportState()};pin.addEventListener('pointermove',move);pin.addEventListener('pointerup',end);pin.addEventListener('pointercancel',end)}
function search(){const q=searchQuery.toLocaleLowerCase('pl').trim();const matches=addresses.filter(a=>!q||a.name.toLocaleLowerCase('pl').includes(q));document.getElementById('results').innerHTML='<small>Adresy przykładowe — bez geokodowania</small>'+(matches.length?matches.map(a=>`<button onclick="chooseAddress(${addresses.indexOf(a)});event.stopPropagation()">⌖ ${esc(a.name)}</button>`).join(''):'<small>Spróbuj: Lipowa, Parkowa lub Ogrodowa.</small>')}
function chooseAddress(i){const a=addresses[i];searchQuery=a.name;if(draft){draft.x=a.x;draft.y=a.y}else searchTarget={x:a.x,y:a.y};render()}
function modal(title,body,save){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal"><h2>${esc(title)}</h2>${body}<footer><button onclick="closeModal()">${save?'Anuluj':'Zamknij'}</button>${save?'<button class="primary" id="modal-save">Dodaj wpis</button>':''}</footer></section></div>`;if(save)document.getElementById('modal-save').onclick=save;document.querySelector('.modal input,.modal select,.modal button')?.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function openInfo(title,text){modal(title,`<p>${esc(text)}</p>`)}
function openEntry(){modal('Nowy wpis historii',`<p>${esc(places[selected].name)}</p><label>Rodzaj</label><select id="entry-kind"><option>Obserwacja</option><option>Działanie</option><option>Sprawdzenie</option><option>Notatka</option></select><label>Czas zdarzenia</label><input id="entry-time" value="16 października · 18:00"><label>Opis</label><textarea id="entry-text" rows="3" placeholder="Co się wydarzyło?"></textarea><label>Zdjęcia</label><input type="file" multiple accept="image/*"><p>Szkic formularza. Pliki nie są wysyłane, a nowy wpis istnieje tylko w pamięci.</p>`,()=>{entries[selected].unshift({kind:document.getElementById('entry-kind').value,time:document.getElementById('entry-time').value||'Czas nieznany',text:document.getElementById('entry-text').value||'Przykładowy wpis',desc:'Dodano w prototypie'});closeModal();render()})}
function openProfile(){modal('Profil Luny',`<label>Imię</label><input value="Luna"><label>Gatunek</label><input value="Kot"><label>Wygląd i cechy</label><textarea>Cała czarna, biała plamka pod szyją.</textarea><label>Zachowanie</label><textarea>Nie wychodzi, płoszy się przy obcych.</textarea><p>W aplikacji także zdrowie, zwyczaje, zdjęcia i okoliczności ucieczki. Ten formularz jest poglądowy.</p>`)}
function openFiles(){openInfo('Plik sprawy','Docelowo: Eksportuj JSON, Otwórz JSON i Nowa sprawa. Przed zastąpieniem sprawy ostrzeżenie i możliwość eksportu. W tym szkicu pliki nie są zapisywane.')}
function openFilter(){modal('Filtry',`<label>Rola punktu</label><select><option>Wszystkie</option><option>Kryjówka</option><option>Karmienie</option></select><label>Rodzaj wpisu</label><select><option>Wszystkie</option><option>Obserwacja</option><option>Działanie</option><option>Sprawdzenie</option></select><label>Czas zdarzenia</label><input placeholder="Od – do"><p>W aplikacji także status odrzucenia. Szkic pokazuje rozmieszczenie kontrolek bez filtrowania danych.</p>`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.modal'))closeModal();else if(draft)cancelPoint()}if(draft&&e.target.id==='draft-pin'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();updateDraft({x:Math.max(2,Math.min(98,draft.x+(e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0))),y:Math.max(3,Math.min(97,draft.y+(e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0)))});reportState()}});render();
</script></body></html>
