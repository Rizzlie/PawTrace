<header>
  <app-brand />
  <div class="connection">
    <p
      role="status"
      aria-label="Połączenie z serwerem"
      [class.online]="connection() === 'online'"
      [class.offline]="connection() === 'offline'"
    >
      @switch (connection()) { @case ('checking') { Sprawdzanie połączenia… }
      @case ('online') { Połączono z serwerem } @case ('offline') { Serwer jest
      niedostępny } }
    </p>
    @if (connection() === 'offline') {
    <button type="button" (click)="reconnect.emit()">Spróbuj ponownie</button> }
  </div>
</header>
